data_root: data
dataset: CIFAR-100
dataset_size: 50000
epochs: 5
logical_batch_size: 1000
physical_batch_size: 250
gradient_accumulation: 4
num_workers: 2
total_steps: 250
model:
  architecture: vit_tiny_patch16_224
  pretrained: true
  num_classes: 100
  image_size: 224
muon:
  momentum: 0.95
  nesterov: true
  ns_steps: 5
  dtype: float32
adam:
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-8
  weight_decay: 0.0
privacy:
  epsilon: 8.0
  delta: 1.0e-5
  k: 5
  b_participation: 50
  adjacency: add_remove_zero_out
  sampling_amplification: false
bandinvmf:
  beta_mf: 0.9
  num_bands: 4
